[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "ainerzero"
version = "0.1.0"
description = "AinerZero developmental world model research foundation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=1.26,<3",
  "pydantic>=2.10,<3",
  "PyYAML>=6,<7",
  "psutil>=6,<8",
  "safetensors>=0.4,<1",
]

[project.optional-dependencies]
metal = ["mlx>=0.32,<0.33; sys_platform == 'darwin' and platform_machine == 'arm64'"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
ainerzero = "ainerzero.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ainerzero"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["metal: requires an actual Metal GPU and MLX (opt-in)"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

