budget:
  max_daily_active_seconds: 2.0
  max_environment_steps: 1000000
  max_optimizer_steps: 20000
  max_wall_seconds: 21600.0
  timezone: Europe/Belgrade
environment:
  course: C0
  hidden_placeholder_byte: 0
  max_episode_ticks: 128
  name: switchlab_v1
evaluation:
  development_seed_count: 3
  episodes_per_course_per_seed: 100
  final_seed_count: 5
model:
  action_count: 4
  action_embedding_dim: 32
  activation: silu
  architecture: brain0_rssm
  byte_embedding_dim: 16
  cells: 8
  decoder_hidden_dim: 1024
  embedding_dim: 512
  encoder_hidden_dim: 512
  ensemble_heads: 5
  ensemble_hidden_dim: 512
  hidden_dim: 1024
  initialization: random
  latent_dim: 64
  minimum_std: 0.1
  posterior_hidden_dim: 1024
  prior_hidden_dim: 1024
  symbol_vocabulary: 256
planning:
  action_cost: 0.01
  candidates: 128
  disagreement_penalty: 0.1
  elites: 16
  horizon: 12
  iterations: 3
  latent_samples: 4
  old_distribution_weight: 0.2
project_name: ainerzero
resources:
  active:
    cpu_workers: 2
    micro_batch_size: 8
    mlx_cache_gib: 1.0
    mlx_memory_gib: 8.0
    project_memory_gib: 16.0
    training_duty_cycle: 0.25
    vector_environments: 8
  activity_poll_seconds: 2.0
  duty_window_seconds: 2.0
  idle:
    cpu_workers: 4
    micro_batch_size: 32
    mlx_cache_gib: 4.0
    mlx_memory_gib: 48.0
    project_memory_gib: 64.0
    training_duty_cycle: 1.0
    vector_environments: 32
  idle_after_seconds: 300.0
  minimum_disk_free_gib: 50.0
  mode: adaptive
  pause_below_available_gib: 8.0
  pause_training_on_battery: true
  swap_growth_gib: 1.0
  swap_growth_samples: 3
  swap_sample_seconds: 10.0
  system_reserve_gib: 16.0
  target_micro_step_seconds: 0.5
schema_version: 1
seed: 0
storage:
  data_dir: artifacts
  disk_budget_gib: 20.0
  keep_best_versions: 2
  keep_recent_checkpoints: 3
  ram_cache_gib: 2.0
  replay_max_transitions: 1000000
  trajectory_shard_mib: 256
teaching:
  allow_teacher_demonstrations: true
  mode: guided
training:
  adam_betas:
  - 0.9
  - 0.999
  adam_epsilon: 1.0e-08
  bias_correction: true
  bootstrap_probability: 0.8
  burn_in_steps: 16
  checkpoint_interval_updates: 1000
  collect_transitions: 1024
  cursor_loss_weight: 0.2
  effective_batch_size: 32
  ema_decay: 0.99
  ensemble_loss_weight: 0.1
  gradient_clip_norm: 1.0
  initial_fit_updates: 500
  kl_free_nats: 1.0
  kl_loss_weight: 0.1
  kl_warmup_updates: 1000
  learning_rate: 0.0003
  optimizer: adamw
  precision: float32
  replay:
    failure: 0.2
    recent: 0.5
    reservoir: 0.3
  sequence_steps: 64
  symbol_loss_weight: 1.0
  updates_per_collection: 8
  validation_interval_updates: 500
  visibility_loss_weight: 0.2
  warmup_transitions: 10000
  weight_decay: 0.0001
